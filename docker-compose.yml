services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: metry_user
      POSTGRES_PASSWORD: metry_password
      POSTGRES_DB: metriguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metry_user -d metriguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://metry_user:metry_password@db:5432/metriguard
      - USE_MOCK_EXTRACTOR=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
